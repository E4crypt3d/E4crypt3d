<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img" aria-label="E4crypt3d - backend, systems and automation developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070910"/>
      <stop offset="0.5" stop-color="#0E1322"/>
      <stop offset="1" stop-color="#151B31"/>
    </linearGradient>
    <linearGradient id="title" x1="94" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#D8DCF5"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="560" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientTransform="translate(300 110) scale(430)">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientTransform="translate(1010 230) scale(400)">
      <stop offset="0" stop-color="#0891B2" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#0891B2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.1" fill="#FFFFFF" fill-opacity="0.10"/>
    </pattern>
    <clipPath id="round">
      <rect x="742" y="58" width="398" height="184" rx="16"/>
    </clipPath>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#glow1)"/>
  <rect width="1200" height="300" fill="url(#glow2)"/>

  <!-- soft top edge light -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#accent)" opacity="0.65"/>

  <!-- accent bar -->
  <rect x="64" y="92" width="5" height="78" rx="2.5" fill="url(#accent)"/>

  <!-- name -->
  <text x="94" y="150" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace" font-size="58" font-weight="700" letter-spacing="-1.5" fill="url(#title)">E4crypt3d</text>

  <!-- tagline -->
  <text x="96" y="196" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#8E9AC4">
    <tspan fill="#22D3EE">$</tspan><tspan fill="#64748B"> </tspan><tspan>backend</tspan><tspan fill="#475569"> / </tspan><tspan>systems</tspan><tspan fill="#475569"> / </tspan><tspan>automation</tspan>
  </text>

  <!-- underline -->
  <rect x="96" y="222" width="470" height="1" fill="url(#line)"/>

  <!-- right: terminal card -->
  <g clip-path="url(#round)">
    <rect x="742" y="58" width="398" height="184" rx="16" fill="#0A0E1A" fill-opacity="0.72"/>
    <rect x="742" y="58" width="398" height="184" fill="url(#dots)"/>
    <rect x="742" y="58" width="398" height="34" fill="#FFFFFF" fill-opacity="0.045"/>
    <line x1="742" y1="92" x2="1140" y2="92" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1"/>
    <circle cx="766" cy="75" r="4.5" fill="#F87171" fill-opacity="0.75"/>
    <circle cx="784" cy="75" r="4.5" fill="#FBBF24" fill-opacity="0.75"/>
    <circle cx="802" cy="75" r="4.5" fill="#34D399" fill-opacity="0.75"/>
    <text x="826" y="80" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#64748B">~/projects</text>

    <g font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace" font-size="14">
      <text x="766" y="124" fill="#22D3EE">$</text>
      <text x="786" y="124" fill="#E2E8F0">build</text>
      <text x="832" y="124" fill="#A78BFA">--release</text>
      <text x="912" y="124" fill="#E2E8F0">optix</text>

      <text x="766" y="150" fill="#22D3EE">$</text>
      <text x="786" y="150" fill="#E2E8F0">oh-my-qwen</text>
      <text x="880" y="150" fill="#64748B">install</text>
      <text x="942" y="150" fill="#34D399">✓</text>
      <text x="962" y="150" fill="#64748B">ready</text>

      <text x="766" y="176" fill="#22D3EE">$</text>
      <text x="786" y="176" fill="#E2E8F0">ezextract</text>
      <text x="884" y="176" fill="#64748B">scrape</text>
      <text x="938" y="176" fill="#34D399">✓</text>
      <text x="958" y="176" fill="#64748B">200</text>

      <text x="766" y="202" fill="#22D3EE">$</text>
      <text x="786" y="202" fill="#E2E8F0">snake</text>
      <text x="838" y="202" fill="#64748B">draw</text>
      <text x="888" y="202" fill="#34D399">✓</text>
      <text x="908" y="202" fill="#64748B">contributions</text>

      <text x="766" y="228" fill="#22D3EE">$</text>
      <rect x="786" y="216" width="10" height="15" fill="#7DD3FC" fill-opacity="0.9"/>
    </g>
  </g>
  <rect x="742.5" y="58.5" width="397" height="183" rx="15.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>
</svg>
